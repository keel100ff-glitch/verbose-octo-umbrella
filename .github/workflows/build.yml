          cat << 'EOF' > app/src/main/res/layout/floating_loading.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#88000000">
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="vertical" android:layout_gravity="center" android:gravity="center">
                  <ProgressBar android:layout_width="wrap_content" android:layout_height="wrap_content" android:indeterminateTint="#00E5FF"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Menjawab soal..." android:textColor="#00E5FF" android:textStyle="bold" android:layout_marginTop="16dp"/>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_answer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/rootAnswer" android:layout_width="320dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_neon_dark" android:padding="20dp">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="📖 Hasil:" android:textColor="#00E5FF" android:textStyle="bold" android:textSize="14sp" android:layout_marginBottom="12dp"/>
              <ScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:maxHeight="400dp">
                  <TextView android:id="@+id/tvAnswer" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="15sp" android:lineSpacingExtra="6dp"/>
              </ScrollView>
              <Button android:id="@+id/btnCopy" android:layout_width="match_parent" android:layout_height="40dp" android:text="📋 Copy Jawaban" android:backgroundTint="#00E5FF" android:textColor="#000000" android:textStyle="bold" android:layout_marginTop="12dp"/>
              <Button android:id="@+id/btnClose" android:layout_width="match_parent" android:layout_height="40dp" android:text="Tutup" android:backgroundTint="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/MainActivity.kt
          package com.example.floatai
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast

          class MainActivity : Activity() {
              private val projectionManager by lazy { getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  val etLicense = findViewById<EditText>(R.id.etLicenseKey)
                  val etApiKey = findViewById<EditText>(R.id.etApiKey)
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  etApiKey.setText(prefs.getString("api_key", ""))

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      val inputKey = etLicense.text.toString().trim().uppercase()
                      val apiKey = etApiKey.text.toString().trim()

                      if (inputKey.startsWith("PRM-") || inputKey.startsWith("TRL-")) {
                          if (apiKey.isEmpty()) {
                              Toast.makeText(this, "API Key Groq jangan kosong!", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          prefs.edit().putString("api_key", apiKey).putString("license_key", inputKey).apply()
                          Toast.makeText(this, "Kode Valid! Robot Aktif.", Toast.LENGTH_SHORT).show()
                          startRobot()
                      } else {
                          Toast.makeText(this, "Kode Akses Tidak Dikenali!", Toast.LENGTH_LONG).show()
                      }
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, FloatingService::class.java))
                      Toast.makeText(this, "Robot dimatikan!", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun startRobot() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  } else {
                      startActivityForResult(projectionManager.createScreenCaptureIntent(), 1001)
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      ScreenCaptureHelper.resultCode = resultCode
                      ScreenCaptureHelper.data = data
                      startForegroundService(Intent(this, FloatingService::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/ScreenCaptureHelper.kt
          package com.example.floatai
          import android.content.Intent
          object ScreenCaptureHelper { var resultCode: Int = 0; var data: Intent? = null }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/FloatingService.kt
          package com.example.floatai
          import android.app.*
          import android.content.BroadcastReceiver
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Base64
          import android.view.*
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class FloatingService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var bubbleView: View
              private var answerView: View? = null
              private var menuView: View? = null
              private var loadingView: View? = null
              
              private var API_KEY = ""
              private var isHidden = false
              private var lastAnswer = ""

              private val stopReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      cleanupAndStop()
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  API_KEY = prefs.getString("api_key", "") ?: ""
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(stopReceiver, IntentFilter("STOP_ROBOT"), RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(stopReceiver, IntentFilter("STOP_ROBOT"))
                  }

                  val channelId = "float_ai"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FloatAI", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notif = Notification.Builder(this, channelId).setContentTitle("Robot Siaga").setSmallIcon(R.drawable.ic_notification).build()
                  startForeground(1, notif)
                  showBubble()
              }

              private fun cleanupAndStop() {
                  if (menuView != null) { windowManager.removeView(menuView); menuView = null }
                  if (answerView != null) { windowManager.removeView(answerView); answerView = null }
                  if (loadingView != null) { windowManager.removeView(loadingView); loadingView = null }
                  if (::bubbleView.isInitialized) { windowManager.removeView(bubbleView) }
                  stopSelf()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(stopReceiver)
              }

              private fun showBubble() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  val params = WindowManager.LayoutParams(
                      150, 150,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 100; params.y = 300
                  
                  bubbleView.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = params.x; initialY = params.y; touchX = event.rawX; touchY = event.rawY; return false }
                              MotionEvent.ACTION_MOVE -> { params.x = initialX + (event.rawX - touchX).toInt(); params.y = initialY + (event.rawY - touchY).toInt(); windowManager.updateViewLayout(bubbleView, params); return true }
                          }
                          return false
                      }
                  })

                  bubbleView.setOnClickListener {
                      if (isHidden) { isHidden = false; bubbleView.alpha = 1.0f } else { showMenu() }
                  }
                  windowManager.addView(bubbleView, params)
              }

              private fun showMenu() {
                  if (menuView != null) return
                  menuView = LayoutInflater.from(this).inflate(R.layout.floating_menu, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.CENTER

                  menuView!!.findViewById<LinearLayout>(R.id.menuJawab).setOnClickListener {
                      closeMenu()
                      showLoadingAndCapture("JAWAB")
                  }
                  menuView!!.findViewById<LinearLayout>(R.id.menuPenjelasan).setOnClickListener {
                      closeMenu()
                      showLoadingAndCapture("PENJELASAN")
                  }
                  menuView!!.findViewById<LinearLayout>(R.id.menuEsai).setOnClickListener {
                      closeMenu()
                      showLoadingAndCapture("ESAI")
                  }
                  val switchSamaran = menuView!!.findViewById<Switch>(R.id.switchSamaran)
                  switchSamaran.isChecked = isHidden
                  switchSamaran.setOnCheckedChangeListener { _, isChecked ->
                      isHidden = isChecked
                      bubbleView.alpha = if (isHidden) 0.01f else 1.0f
                  }

                  windowManager.addView(menuView, params)
              }

              private fun closeMenu() {
                  if (menuView != null) {
                      windowManager.removeView(menuView)
                      menuView = null
                  }
              }

              private fun showLoadingAndCapture(mode: String) {
                  if (loadingView != null) return
                  if (answerView != null) {
                      windowManager.removeView(answerView)
                      answerView = null
                  }
                  
                  loadingView = LayoutInflater.from(this).inflate(R.layout.floating_loading, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  windowManager.addView(loadingView, params)
                  
                  Handler(Looper.getMainLooper()).postDelayed({
                      captureAndSolve(mode)
                  }, 500)
              }

              private fun removeLoading() {
                  if (loadingView != null) {
                  windowManager.removeView(loadingView)
                  loadingView = null
                  }
              }

              private fun captureAndSolve(mode: String) {
                  try {
                      val data = ScreenCaptureHelper.data ?: return
                      val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val projection = mpManager.getMediaProjection(ScreenCaptureHelper.resultCode, data)
                      val metrics = resources.displayMetrics
                      val w = metrics.widthPixels; val h = metrics.heightPixels; val density = metrics.densityDpi
                      val imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 1)
                      val virtualDisplay = projection.createVirtualDisplay("cap", w, h, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.surface, null, null)
                      
                      thread {
                          try {
                              Thread.sleep(300)
                              val image = imageReader.acquireLatestImage()
                              if (image != null) {
                                  val planes = image.planes; val buffer = planes[0].buffer
                                  val pixelStride = planes[0].pixelStride; val rowStride = planes[0].rowStride
                                  val rowPadding = rowStride - pixelStride * w
                                  val bitmap = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                                  bitmap.copyPixelsFromBuffer(buffer); image.close()
                                  val cropped = Bitmap.createBitmap(bitmap, 0, 0, w, h)
                                  askAIWithImage(cropped, mode)
                              }
                              virtualDisplay.release(); projection.stop()
                          } catch (e: Exception) {
                              Handler(Looper.getMainLooper()).post { removeLoading(); showResult("Gagal memotret layar: ${e.message}") }
                          }
                      }
                  } catch (e: Exception) {
                      removeLoading()
                      showResult("Error Capture: ${e.message}")
                  }
              }

              private fun askAIWithImage(bitmap: Bitmap, mode: String) {
                  thread {
                      try {
                          val stream = ByteArrayOutputStream()
                          bitmap.compress(Bitmap.CompressFormat.JPEG, 40, stream)
                          val base64Image = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)

                          val promptText = when(mode) {
                              "JAWAB" -> "Baca soal ini. Berikan HANYA jawaban akhirnya saja (1 kata atau opsi A/B/C/D)."
                              "ESAI" -> "Baca soal esai ini. Berikan jawaban yang SANGAT SINGKAT, maksimal 1-2 baris kalimat. Langsung ke intinya."
                              else -> "Baca soal ini. Berikan jawaban dan penjelasan singkat."
                          }

                          val url = URL("https://api.groq.com/openai/v1/chat/completions")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.setRequestProperty("Authorization", "Bearer $API_KEY")
                          conn.doOutput = true
                          conn.connectTimeout = 30000
                          conn.readTimeout = 30000

                          val bodyJson = JSONObject().apply {
                              put("model", "llama-3.1-8b-instant")
                              put("messages", JSONArray().apply {
                                  put(JSONObject().apply {
                                      put("role", "user")
                                      put("content", JSONArray().apply {
                                          put(JSONObject().apply { put("type", "text"); put("text", promptText) })
                                          put(JSONObject().apply { put("type", "image_url"); put("image_url", JSONObject().apply { put("url", "data:image/jpeg;base64,$base64Image") }) })
                                      })
                                  })
                              })
                          }

                          val os = OutputStreamWriter(conn.outputStream)
                          os.write(bodyJson.toString())
                          os.flush()
                          os.close()

                          val responseCode = conn.responseCode
                          if (responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = StringBuilder()
                              var line: String?
                              while (reader.readLine().also { line = it } != null) { response.append(line) }
                              reader.close()
                              
                              var answer = try {
                                  JSONObject(response.toString()).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                              } catch (e: Exception) { "Gagal parse API" }

                              answer = answer.replace("**", "").replace("###", "").replace(">", "").trim()
                              lastAnswer = answer
                              
                              Handler(Looper.getMainLooper()).post { 
                                  removeLoading()
                                  showResult(answer) 
                              }
                          } else {
                              Handler(Looper.getMainLooper()).post { 
                                  removeLoading()
                                  showResult("Error Groq: $responseCode") 
                              }
                          }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post { 
                              removeLoading()
                              showResult("Koneksi lambat (Timeout)!") 
                          }
                      }
                  }
              }

              private fun showResult(text: String) {
                  if (answerView == null) {
                      answerView = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                      )
                      params.gravity = Gravity.CENTER
                      
                      answerView!!.findViewById<Button>(R.id.btnCopy).setOnClickListener {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("Jawaban", lastAnswer))
                          Toast.makeText(this, "Jawaban di-copy!", Toast.LENGTH_SHORT).show()
                      }
                      
                      answerView!!.findViewById<Button>(R.id.btnClose).setOnClickListener {
                          windowManager.removeView(answerView); answerView = null
                      }
                      
                      windowManager.addView(answerView, params)
                  }
                  answerView!!.findViewById<TextView>(R.id.tvAnswer).text = text
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
