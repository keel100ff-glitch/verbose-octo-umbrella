              <LinearLayout android:id="@+id/menuPenjelasan" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="12dp" android:background="?android:attr/selectableItemBackground">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📖 Penjelasan Lengkap" android:textColor="#FFFFFF" android:textSize="15sp"/>
              </LinearLayout>
              <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#333333" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/>
              <LinearLayout android:id="@+id/menuEsai" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="12dp" android:background="?android:attr/selectableItemBackground">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="✍️ Jawab Esai (Singkat)" android:textColor="#FFFFFF" android:textSize="15sp"/>
              </LinearLayout>
              <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#333333" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="12dp">
                  <TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="🕵️ Mode Samaran" android:textColor="#FFFFFF" android:textSize="15sp"/>
