          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="240dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_neon_dark" android:padding="20dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="AI Assistant" android:textColor="#00E5FF" android:textStyle="bold" android:textSize="16sp" android:layout_marginBottom="16dp"/>
              <LinearLayout android:id="@+id/menuJawab" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="12dp" android:background="?android:attr/selectableItemBackground">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📝 Jawab Singkat" android:textColor="#FFFFFF" android:textSize="15sp"/>
