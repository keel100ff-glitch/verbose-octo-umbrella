                  <EditText android:id="@+id/etApiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Masukkan API Key Groq" android:textColorHint="#999999" android:textColor="#000000" android:backgroundTint="#00B8D4" android:layout_marginBottom="32dp"/>
                  <Button android:id="@+id/btnStart" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Verifikasi &amp; Aktifkan" android:backgroundTint="#00B8D4" android:textColor="#FFFFFF" android:textStyle="bold" android:layout_marginBottom="16dp"/>
                  <Button android:id="@+id/btnStop" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="MATIKAN ROBOT" android:backgroundTint="#FF1744" android:textColor="#FFFFFF" android:textStyle="bold"/>
